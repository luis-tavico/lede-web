<!doctype html>
<html lang="es-GT" data-raiz="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceder ‹ Tienda — WordPress</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../css/admin.css">
</head>
<!-- /<tienda>/wp-login.php: el emprendedor entraba con el usuario creado con su Gmail. -->
<body class="wp">
<main class="acceso">
  <a class="acceso__logo" href="../portal.html"><img src="../assets/logos/estacion-vertical.png" alt="La Estación del Emprendedor" width="422" height="393"></a>
  <p class="wp-aviso" role="status" data-salio hidden>Has cerrado sesión.</p>
  <p class="nota-demo">Acceso del emprendedor al panel de su tienda. Demostración: presiona «Acceder» para entrar; no hace falta usuario ni contraseña.</p>
  <form data-acceso>
    <label for="usuario">Nombre de usuario o dirección de correo electrónico</label>
    <input class="wp-campo" id="usuario" autocomplete="username">
    <label for="clave">Contraseña</label>
    <input class="wp-campo" id="clave" type="password" autocomplete="current-password">
    <div class="acceso__pie">
      <label><input type="checkbox"> Recuérdame</label>
      <button class="wp-boton wp-boton--primario" type="submit">Acceder</button>
    </div>
  </form>
  <div class="acceso__enlaces">
    <p><a href="../index.html">← Volver a la guía de la demostración</a></p>
    <p><a data-volver href="index.html">← Volver a la tienda</a></p>
  </div>
</main>
<script src="../js/datos.js"></script>
<script src="../js/comun.js"></script>
<script src="../js/tienda-estado.js"></script>
<script>
(function () {
  var E = window.Estacion;
  var slug = E.parametro('t');
  var estado = slug ? window.TiendaEstado(slug) : null;
  if (!estado) { document.querySelector('main').innerHTML = '<p>No se encontró la tienda.</p>'; return; }
  document.title = 'Acceder ‹ ' + estado.tienda.nombre + ' — WordPress';
  document.querySelector('[data-volver]').href = 'index.html?t=' + slug;
  document.querySelector('[data-volver]').textContent = '← Ir a ' + estado.tienda.nombre;
  document.querySelector('[data-salio]').hidden = !E.parametro('salio');
  document.querySelector('[data-acceso]').addEventListener('submit', function (ev) {
    ev.preventDefault();
    window.TiendaEstado.escribir(estado.claveAdmin, true);
    location.href = 'wp-admin.html?t=' + slug;
  });
})();
</script>
</body>
</html>
